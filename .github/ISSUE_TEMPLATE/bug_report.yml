name: Bug report
description: Report a scanner, rule, CLI, watch-mode, or diff bug.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail
        to reproduce it without guessing.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and the impact.
      placeholder: The scanner returned...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: I expected the graph to...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command, URL, or local path if possible.
      placeholder: |
        1. Run `dotnet run --project src/ArchPulse.Cli -- scan .`
        2. See ...
        3. Expected ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner / project discovery
        - Aspire AppHost parser
        - Rules engine
        - CLI / terminal output
        - Graph / diff
        - Watch mode
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Redact secrets and private repository names.
      render: shell
    validations:
      required: false
