name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArchPulse.slnx

      - name: Build
        run: dotnet build ArchPulse.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ArchPulse.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Scan ArchPulse itself
        run: dotnet run --project src/ArchPulse.Cli --configuration Release -- scan . --output artifacts/self --fail-on error

      - name: Scan the intentionally flawed sample
        run: dotnet run --project src/ArchPulse.Cli --configuration Release -- scan samples/ContosoShop --output artifacts/contoso

      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-artifacts
          path: artifacts/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
